name: CI
on:
  pull_request:
  push:
    branches: [master, feat/three-tier-split]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-web.txt
      - run: |
          python -m pytest -q \
            --ignore=tests/test_embed.py \
            --ignore=tests/test_exact.py \
            --ignore=tests/test_llm.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci && npm test && npm run lint
