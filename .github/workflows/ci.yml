name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs are cancelled: images.yml publishes only after a
  # master run succeeds, so a cancelled master run would skip its images.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            deploy/docker/constraints-backend.txt
      # The backend image's pinned deps, plus rich for the two worker bench test
      # modules; the torch/CUDA pipeline stack (requirements.txt) is not installed.
      - run: python -m pip install -r requirements-backend.txt -c deploy/docker/constraints-backend.txt pytest==9.0.3 rich==15.0.0
      # Deselected: annotation-table lookups that already fail on master.
      - run: |
          python -m pytest tests -q \
            --deselect tests/test_gene_names.py::test_annotation_table_lookup_returns_gene_name \
            --deselect tests/test_gene_names.py::test_annotation_table_lookup_locus_from_exact_gene_name \
            --deselect tests/test_gene_names.py::test_annotation_table_lookup_locus_case_insensitive_unique \
            --deselect tests/test_gene_names.py::test_annotation_table_lookup_locus_ambiguous \
            --deselect tests/test_gene_names.py::test_annotation_table_lookup_locus_by_locus_column_case_insensitive

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same major as deploy/docker/Dockerfile.frontend (node:20-alpine).
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
