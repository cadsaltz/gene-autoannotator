services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    # The image's CMD runs uvicorn from /state (so the relative SQLite path lands
    # in the backend-data volume). Its entrypoint starts as root, chowns both
    # volumes to uid 10001, then runs the server as that user.
    ports:
      - "8000:8000"
    env_file:
      # An HPC-only deploy must set WORKER_CAPACITY_REQUIRED=0 here, otherwise
      # submission is rejected until a worker is warm and the dispatcher never
      # sees a queued job. See docs/deploy-cloud-backend-hpc-dispatcher.md.
      - ../../.env
    volumes:
      - backend-data:/state/backend
      - profiles-data:/app/data/profiles
    environment:
      PROFILES_DIR: /app/data/profiles
      # Lets `docker compose exec -u app backend python -m backend.manage ...` import
      # the app from /state, where the relative DB path must resolve.
      PYTHONPATH: /app

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    env_file:
      - ../../.env
    environment:
      BACKEND_API_BASE_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  backend-data:
  profiles-data:
