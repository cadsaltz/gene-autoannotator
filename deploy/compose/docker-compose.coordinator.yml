services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.coordinator
    working_dir: /state
    command:
      - uvicorn
      - backend.api:app
      - --app-dir
      - /app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    volumes:
      # Keep the legacy state path so existing coordinator-data volumes remain valid.
      - coordinator-data:/state/coordinator
      - profiles-data:/app/data/profiles
    environment:
      PROFILES_DIR: /app/data/profiles

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    env_file:
      - ../../.env
    environment:
      BACKEND_API_BASE_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  coordinator-data:
  profiles-data:
