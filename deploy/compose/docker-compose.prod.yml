# Production stack: prebuilt images, Caddy in front, state in named volumes.
# Always pass -p (the old docker-compose.backend.yml stack runs as project
# "compose"; sharing its name would recreate its containers):
#   docker compose -p gaa -f deploy/compose/docker-compose.prod.yml \
#     --env-file deploy/compose/compose.env up -d
# See deploy/README.md for staging, data migration, and updates.
name: gaa

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ghcr.io/cadsaltz/gene-autoannotator-backend:${IMAGE_TAG:-prod}
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-backend.env}
    environment:
      # Must match the profiles-data mount below, whatever backend.env says.
      PROFILES_DIR: /app/data/profiles
    volumes:
      - backend-data:/state/backend
      - profiles-data:/app/data/profiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  frontend:
    image: ghcr.io/cadsaltz/gene-autoannotator-frontend:${IMAGE_TAG:-prod}
    restart: unless-stopped
    env_file:
      - ${FRONTEND_ENV_FILE:-frontend.env}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in compose.env (a hostname, or :80 for staging)}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
    logging: *logging

volumes:
  backend-data:
  profiles-data:
  caddy-data:
  caddy-config:
