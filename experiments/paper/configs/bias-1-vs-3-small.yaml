experiment_id: bias-1-vs-3-small
config_version: 1
owner: Caden
n_trials: 10
max_trials: 15
claim: >
  Using three unrelated small extractor LLMs plus consensus reduces bias and
  hallucination relative to a single small extractor on the same evidence.
status: fixtures-ready

models:
  extractors:
    - qwen3.5:0.8b    # A
    - gemma3:1b       # B
    - llama3.2:1b     # C
  consensus: qwen3:0.6b

fixtures:
  papers: fixtures/paper_snapshots/bias_cluster_v1.json
  genes: fixtures/gene_sets/bias_cluster_v1.json

nli:
  model_id: roberta-large-mnli

cache_policy: cold_llm_preferred

conditions:
  - extractor_A
  - extractor_B
  - extractor_C
  - consensus_D
  - single_A
  - single_B
  - single_C

metrics:
  - field_supported_rate
  - field_unsupported_rate
  - field_null_rate
  - cross_extractor_disagreement_rate

notes: |
  Shared frozen papers/genes with cost-benefit-1-vs-3 and split-vs-not.
  cache_policy: cold_llm_preferred — prefer cold LLM cache hits; document actual behavior in manifest.
