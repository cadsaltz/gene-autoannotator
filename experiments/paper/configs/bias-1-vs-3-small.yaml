experiment_id: bias-1-vs-3-small
config_version: 2
owner: Caden
n_trials: 10
max_trials: 15
claim: >
  Using three unrelated local (non-frontier-API) extractor LLMs plus consensus
  reduces bias and hallucination relative to a single local extractor on the
  same evidence. Experiment id keeps "small" to mean local/open weights, not
  the lite/nano RAM tiers.
status: runnable

models:
  # Pipeline performance stack (autoannotation.models.PERF_MODELS)
  extractors:
    - qwen3:14b           # A
    - gemma3:12b          # B
    - mistral-nemo:12b    # C
  consensus: qwen3:8b

fixtures:
  papers: fixtures/paper_snapshots/bias_cluster_v1.json
  genes: fixtures/gene_sets/bias_cluster_v1.json

nli:
  model_id: roberta-large-mnli

cache_policy: cold_llm_preferred

conditions:
  - extractor_A
  - extractor_B
  - extractor_C
  - consensus_D
  - single_A
  - single_B
  - single_C

metrics:
  - field_supported_rate
  - field_unsupported_rate
  - field_null_rate
  - cross_extractor_disagreement_rate

notes: |
  Shared frozen papers/genes with cost-benefit-1-vs-3 and split-vs-not.
  Models are the performance tier (not lite/nano). "small" in the experiment
  id means local open-weight models vs paid frontier APIs.
  cache_policy: cold_llm_preferred — document actual behavior in manifest.
