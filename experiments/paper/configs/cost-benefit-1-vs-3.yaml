experiment_id: cost-benefit-1-vs-3
config_version: 2
owner: Caden
n_trials: 10
max_trials: 15
claim: >
  The quality benefit of three extractors plus consensus outweighs (or is
  quantified against) the additional compute cost versus a single extractor.
status: runnable

models:
  extractors:
    - qwen3:14b           # A
    - gemma3:12b          # B
    - mistral-nemo:12b    # C
  consensus: qwen3:8b

fixtures:
  papers: fixtures/paper_snapshots/bias_cluster_v1.json
  genes: fixtures/gene_sets/bias_cluster_v1.json

nli:
  model_id: roberta-large-mnli

cache_policy: cold_llm_preferred

conditions:
  - extractor_single
  - extractors_k3_plus_consensus

metrics:
  - unsupported_rate_delta
  - supported_rate_delta
  - null_rate_delta
  - wall_time_sec
  - llm_calls
  - tokens_or_proxy

notes: |
  Prefer joint runs with bias-1-vs-3-small so quality and cost share one manifest.
  Shares frozen fixtures with bias-1-vs-3-small and split-vs-not.
  Uses the same performance-tier models as bias-1-vs-3-small.
