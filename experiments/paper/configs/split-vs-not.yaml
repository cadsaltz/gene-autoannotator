experiment_id: split-vs-not
config_version: 1
owner: Caden
parent_experiment_id: bias-1-vs-3-small
parent_run_dir: results/bias-1-vs-3-small/pilot1
n_trials: 10
max_trials: 15
claim: >
  A substantial fraction of field-level decisions are split across extractors,
  which motivates a consensus / tie-break stage (and measures where crowds help).
status: fixtures-ready

models:
  extractors:
    - qwen3.5:0.8b    # A
    - gemma3:1b       # B
    - llama3.2:1b     # C
  consensus: qwen3:0.6b

fixtures:
  papers: fixtures/paper_snapshots/bias_cluster_v1.json
  genes: fixtures/gene_sets/bias_cluster_v1.json

nli:
  model_id: roberta-large-mnli

cache_policy: cold_llm_preferred

conditions:
  - extractors_k3_pre_consensus

metrics:
  - unanimous_field_rate
  - split_field_rate
  - split_rate_by_field_type

notes: |
  Often derivable from records.jsonl of bias-1-vs-3-small; may not need a separate runner.
  Shares frozen fixtures with bias-1-vs-3-small and cost-benefit-1-vs-3.
