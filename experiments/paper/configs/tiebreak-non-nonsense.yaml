experiment_id: tiebreak-non-nonsense
config_version: 1
owner: Caden
claim: >
  Hybrid consensus resolves non-nonsense paraphrase and exact majorities into
  a single labeled expected answer; consensus beats always-taking extractor 0
  when extractor 0 is the minority error.
status: runnable
config_filter:
  experiment_tags:
    - tiebreak-non-nonsense

models:
  consensus: qwen3:8b
  extractors: []

fixtures:
  constructed: fixtures/constructed/tiebreak_consensus_v1.json

conditions:
  - no_consensus_pick_extractor_0
  - hybrid_consensus

metrics:
  - consensus_match_soft_rate
  - baseline_match_soft_rate
  - necessity_delta
  - llm_invoked_rate
  - expect_llm_calibration_rate
  - invention_rate

notes: |
  Shared suite with tiebreak-nonsense. Includes general apples-style examples.
  See docs/superpowers/specs/2026-09-03-tiebreak-consensus-experiments-design.md
