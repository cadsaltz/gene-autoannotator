experiment_id: tiebreak-nonsense
config_version: 1
owner: Caden
claim: >
  Hybrid consensus adopts clear majority answers—including made-up nonsense
  words—and an LLM tie-breaker reconciles paraphrase majorities into one
  expected answer without reading source excerpts (trust-the-extractors).
status: runnable
config_filter:
  experiment_tags:
    - tiebreak-nonsense

models:
  consensus: qwen3:0.6b
  extractors: []    # unused — candidates are constructed

fixtures:
  constructed: fixtures/constructed/tiebreak_consensus_v1.json

conditions:
  - no_consensus_pick_extractor_0
  - hybrid_consensus

metrics:
  - consensus_match_soft_rate
  - baseline_match_soft_rate
  - necessity_delta
  - llm_invoked_rate
  - expect_llm_calibration_rate
  - invention_rate
  - nonsense_majority_adoption_rate

notes: |
  Shared suite with tiebreak-non-nonsense (approach one). excerpt=None always.
  See docs/superpowers/specs/2026-09-03-tiebreak-consensus-experiments-design.md
